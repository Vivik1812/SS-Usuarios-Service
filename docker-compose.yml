services:
  usuarios-db:
    image: postgres:16
    container_name: usuarios-db
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    networks:
      - ss-net
    
  usuarios-service:
    build: .
    container_name: usuarios-service
    depends_on:
      - usuarios-db
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET} 
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ss-net
volumes:
  usuarios_data:     
networks:
  ss-net:
    external: true

